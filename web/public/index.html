<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="description" content="GARSS：筛选 RSS 信息，保存稍后读，进入专注阅读。">
  <meta name="theme-color" content="#f5f7fb">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data:; connect-src 'self'; object-src 'none'; base-uri 'self'">
  <title>信息流 · GARSS</title>
  <link rel="icon" type="image/png" href="./_media/review-icon-192.png">
  <link rel="stylesheet" href="./assets/shared/base.css">
  <link rel="stylesheet" href="./assets/reader.css">
  <script type="module" src="./assets/reader/app.mjs"></script>
</head>
<body>
  <a class="skip-link" href="#articles">跳到文章列表</a>
  <header class="site-header">
    <a class="brand" href="./">GARSS</a>
    <nav class="header-links" aria-label="主导航"><a href="./" aria-current="page">信息流</a><a href="./sources.html">订阅源</a><a href="./sync.html">同步记录</a><label class="theme-control"><span class="visually-hidden">外观</span><select id="theme-choice" aria-label="外观"><option value="system">跟随系统</option><option value="light">浅色</option><option value="dark">深色</option></select></label></nav>
  </header>
  <main class="reader">
    <section class="reading-heading" aria-labelledby="page-title">
      <div><h1 id="page-title">信息流</h1><p>先找到值得读的内容，再留一点时间慢慢看。</p></div>
      <div class="edition"><strong id="edition-date">正在读取信息流</strong><span id="snapshot-info">连接静态目录…</span><a href="./sync.html">查看同步记录</a></div>
    </section>
    <div class="reading-layout">
      <aside class="source-index" aria-label="订阅来源"><h2>阅读来源 <span id="source-count"></span></h2><label class="visually-hidden" for="source-search">搜索订阅来源</label><input id="source-search" type="search" placeholder="查找来源" autocomplete="off"><div id="source-list"></div><p class="index-note">这里只显示有文章的来源。</p></aside>
      <section class="reading-column" aria-labelledby="stream-title">
        <div class="stream-toolbar"><div><h2 id="stream-title">全部文章</h2><span id="result-count" aria-live="polite">正在加载…</span></div><label class="article-search"><span class="visually-hidden">搜索文章</span><input id="article-search" type="search" placeholder="搜索标题或来源" autocomplete="off"></label></div>
        <div class="reading-modes" role="group" aria-label="阅读筛选"><button type="button" data-mode="all" aria-pressed="true">全部</button><button type="button" data-mode="unread" aria-pressed="false">未读</button><button type="button" data-mode="saved" aria-pressed="false">稍后读</button></div>
        <div class="stream-options"><label for="article-sort">排序 <select id="article-sort"><option value="newest">最新发布</option><option value="oldest">最早发布</option></select></label><button id="clear-filters" class="text-button" type="button" hidden>清除筛选</button><span>打开文章，进入专注阅读</span></div>
        <div id="articles" class="article-list" aria-busy="true"></div>
        <div id="reader-message" class="reader-message" role="status"><strong>正在整理文章…</strong><p>请稍候，正在读取最新目录。</p></div>
        <button id="retry-load" class="button" type="button" hidden>重新加载</button>
        <nav class="reader-pagination" aria-label="文章分页"><button id="previous-page" class="button" type="button" disabled>上一页</button><span id="page-indicator">第 1 / 1 页</span><button id="next-page" class="button" type="button" disabled>下一页</button></nav>
      </section>
    </div>
  </main>
  <footer><span>GARSS · 阅读由你安排</span><span>由 RSS 与 GitHub Actions 驱动 <a href="./api/index.json">开放 JSON</a></span></footer>
  <dialog id="focus-reader" aria-labelledby="focus-title"><div class="focus-toolbar"><span>专注阅读</span><button id="focus-close" class="button" type="button">返回列表</button></div><article class="focus-content"><p id="focus-meta" class="article-meta"></p><h2 id="focus-title"></h2><p class="focus-label">RSS 摘要</p><div id="focus-summary"></div><p id="focus-hint"></p><div class="focus-actions"><a id="focus-original" class="button button-primary" target="_blank" rel="noopener noreferrer">阅读原文</a><button id="focus-save" class="button" type="button">加入稍后读</button></div></article><nav class="focus-navigation" aria-label="专注阅读文章切换"><button id="focus-previous" class="button" type="button">上一篇</button><span id="focus-position"></span><button id="focus-next" class="button" type="button">下一篇</button></nav></dialog>
  <noscript><p>请启用 JavaScript，也可查看 <a href="./api/v1/articles.json">文章 JSON</a>。</p></noscript>
</body>
</html>
