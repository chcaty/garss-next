name: Apply source requests
on:
  issues:
    types: [opened, edited]
permissions:
  contents: read
concurrency:
  group: source-config-requests
  cancel-in-progress: false
  queue: max
jobs:
  apply:
    if: >-
      github.event.issue.user.login == github.repository_owner &&
      github.event.sender.login == github.repository_owner &&
      startsWith(github.event.issue.body, '<!-- shiyue-source-request:v1 -->')
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      issues: write
      actions: write
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main
      - uses: actions/setup-python@v7
        with:
          python-version: '3.13'
      - run: pip install -r requirements.txt
      - name: Prepare owner-confirmed request
        id: request
        env:
          GH_TOKEN: ${{ github.token }}
        run: python tools/apply_source_request.py --event "$GITHUB_EVENT_PATH"
      - name: Validate sources and changed addresses
        if: steps.request.outputs.outcome == 'changed'
        run: |
          PYTHONPATH=collector python -m unittest discover -s tests -q
          python tools/validate_sources.py --base build/base-sources.json
      - name: Save source configuration
        if: steps.request.outputs.outcome == 'changed'
        env:
          ISSUE_NUMBER: ${{ github.event.issue.number }}
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add sources.json
          git commit -m "Apply RSS source request #$ISSUE_NUMBER"
          git push origin HEAD:main
      - name: Start collection and report result
        if: success() && steps.request.outputs.outcome != 'skip'
        uses: actions/github-script@v8
        with:
          script: |
            await github.rest.actions.createWorkflowDispatch({
              owner: context.repo.owner, repo: context.repo.repo,
              workflow_id: 'collect.yml', ref: 'main'
            });
            const body = '来源改动已通过校验并应用，采集任务已启动。发布后网页和 App 会读取更新。\n\n[查看采集进度](https://github.com/' + context.repo.owner + '/' + context.repo.repo + '/actions/workflows/collect.yml)';
            await github.rest.issues.createComment({...context.repo, issue_number: context.issue.number, body});
            await github.rest.issues.update({...context.repo, issue_number: context.issue.number, state: 'closed', state_reason: 'completed'});
      - name: Report unsuccessful request
        if: failure()
        uses: actions/github-script@v8
        with:
          script: |
            const log = 'https://github.com/' + context.repo.owner + '/' + context.repo.repo + '/actions/runs/' + context.runId;
            const body = '此请求未完成。请查看校验或提交失败原因；重新加载发布配置并检查草稿后，可编辑此请求重试。若配置已提交但采集启动失败，可在采集页面手动运行。\n\n[查看处理日志](' + log + ')';
            await github.rest.issues.createComment({...context.repo, issue_number: context.issue.number, body});
