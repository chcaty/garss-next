name: Validate changes
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v7
        with:
          python-version: '3.13'
      - run: pip install -r requirements.txt
      - run: PYTHONPATH=collector python -m unittest discover -s tests -q
      - run: python tools/validate_sources.py
      - name: Validate changed feed addresses on PR
        if: github.event_name == 'pull_request'
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
        run: |
          mkdir -p build
          git show "$BASE:sources.json" > build/base-sources.json
          python tools/validate_sources.py --base build/base-sources.json
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm run check && npm test && npm run build
